# proof-manifest.toml
#
# Canonical register of proof numbers (test counts) that may be cited on the public
# site (index.html, GO-LIVE.md, case-studies/*.html, README.md, etc.).
#
# Each entry's `value` is the ONLY number that is allowed to be cited for that repo
# anywhere in committed site content. It is produced by ACTUALLY RUNNING the suite
# named in `source_cmd`, in `source_repo`, and reading the pytest summary line's
# "N passed" count (never "collected", never "passed + skipped" summed together).
#
# scripts/check_proof_numbers.py reads this file and fails a commit if any citation
# in site content contradicts it. See that script's module docstring for the exact
# matching/association rules.
#
# Key = the repo keyword as it is expected to appear in site text (e.g. "mcp-factory").
#
# PATH HARDENING (2026-07-24): this file is publicly served (no-build-step
# static deploy -- jaimenbell.dev/proof-manifest.toml is a real fetchable
# URL), so it carries ONLY public identity (source_repo_public, a github
# slug) -- never a local filesystem path. The actual local absolute path
# used to live-verify each entry (source_repo) -- plus any source_env value
# that is itself a local path -- lives in the untracked
# proof-manifest.local.toml overlay instead (gitignored; see
# proof-manifest.local.toml.example for the template, and
# scripts/check_proof_numbers.py's LOCAL_MANIFEST_PATH header comment for how
# it's merged in at live-check time). Without that overlay present (CI, a
# fresh public clone) the live-check for each entry degrades to an honest
# WARN, never a FAIL.
#
# VISIBILITY (2026-07-29): a `visibility` field marks whether the entry's
# `source_repo_public` github slug is a repo a site visitor can actually open
# and re-count for themselves. Absent = "public" (the default -- most entries
# don't set it explicitly, same sparse-only-when-needed convention as
# source_repo/source_env above). Set `visibility = "private"` when the repo
# is private: the number is still live-verified by THIS operator (the
# live-check machinery doesn't care about GitHub visibility, only local
# filesystem access via proof-manifest.local.toml), but it is NOT
# independently checkable by a visitor clicking through -- the site must say
# so next to every citation of that number. check_proof_numbers.py reports
# (never fails) every private-visibility entry via the same honest-WARN
# convention as a missing live-check.
#
# SOURCE_TIMEOUT (2026-07-30): live-checking an entry runs its real suite
# under a global timeout (LIVE_CHECK_TIMEOUT_SECONDS = 90s in
# check_proof_numbers.py) -- a hang or a genuinely slow suite WARNs rather
# than blocking the commit forever. Absent = the global 90s applies (the
# default, most entries don't set it -- same sparse-only-when-needed
# convention as source_repo/source_env/visibility above). Set
# `source_timeout = <seconds>` on an entry ONLY when its suite legitimately
# runs close enough to the global default, with real run-to-run variance,
# that it intermittently trips the timeout and goes permanently unverified
# -- never raise the global default itself just to accommodate one outlier
# entry. Unlike source_repo/source_env, a timeout value carries no local
# filesystem path, so it lives directly on this tracked manifest (no
# proof-manifest.local.toml overlay needed).

